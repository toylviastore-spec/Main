<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Liquid Glass Shader</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #sourceImage { display: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<img id="sourceImage" alt="" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='1600' height='900'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%230b1a3a'/%3E%3Cstop offset='.6' stop-color='%23365a9a'/%3E%3Cstop offset='1' stop-color='%23d9a066'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='1600' height='900' fill='url(%23g)'/%3E%3Ccircle cx='1200' cy='260' r='90' fill='%23fff3c4'/%3E%3Cg fill='%23fff' opacity='.85'%3E%3Ccircle cx='200' cy='120' r='3'/%3E%3Ccircle cx='520' cy='80' r='2'/%3E%3Ccircle cx='900' cy='140' r='3'/%3E%3Ccircle cx='1400' cy='90' r='2'/%3E%3Ccircle cx='700' cy='220' r='2'/%3E%3C/g%3E%3Crect y='600' width='1600' height='300' fill='%23140d08'/%3E%3Cg stroke='%23fff' stroke-width='14'%3E%3Cpath d='M0 460H1600'/%3E%3Cpath d='M0 640H1600' stroke='%23e8425a'/%3E%3C/g%3E%3Ctext x='140' y='560' font-family='Arial' font-weight='700' font-size='150' fill='%23fff'%3ELIQUID GLASS%3C/text%3E%3C/svg%3E">

<script id="fragShader" type="x-shader/x-fragment">
precision highp float;
uniform vec3 iResolution;
uniform float iTime;
uniform vec4 iMouse;
uniform sampler2D iChannel0;

float sdRoundBox(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

vec2 coverUV(vec2 uv) {
  float screen = iResolution.x / iResolution.y;
  float image = 16.0 / 9.0;
  vec2 s = screen > image ? vec2(1.0, image / screen) : vec2(screen / image, 1.0);
  return (uv - 0.5) * s + 0.5;
}

vec3 bg(vec2 uv) {
  return texture2D(iChannel0, vec2(coverUV(uv).x, 1.0 - coverUV(uv).y)).rgb;
}

void main() {
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = frag / iResolution.xy;
  vec2 center = iMouse.xy;
  if (iMouse.x + iMouse.y < 1.0) {
    center = iResolution.xy * (0.5 + 0.12 * vec2(sin(iTime * 0.8), cos(iTime * 0.6)));
  }
  vec2 hs = vec2(150.0, 150.0);
  vec2 p = frag - center;
  float d = sdRoundBox(p, hs, 60.0);

  vec3 col = bg(uv);
  if (d < 0.0) {
    float depth = clamp(-d / 60.0, 0.0, 1.0);
    float bulge = pow(1.0 - depth, 2.0);
    vec2 dir = normalize(p + 0.001);
    vec2 wob = 0.004 * vec2(sin(p.y * 0.05 + iTime * 2.0), cos(p.x * 0.05 + iTime * 2.0));
    vec2 offs = -dir * bulge * 0.12 + wob;
    vec2 zoom = uv + (center / iResolution.xy - uv) * 0.25 + offs;
    vec3 r = vec3(bg(zoom + offs * 0.15).r, bg(zoom).g, bg(zoom - offs * 0.15).b);
    col = mix(r, vec3(0.92, 0.96, 1.0), 0.10);
    float rim = smoothstep(0.0, 1.0, bulge);
    col += rim * 0.35 * vec3(1.0);
    col += 0.25 * smoothstep(8.0, 0.0, abs(d + 3.0)) * (0.5 + 0.5 * dir.y);
  }
  col *= 1.0 - 0.25 * smoothstep(14.0, 0.0, d) * step(0.0, d);
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script src="script.js"></script>
</body>
</html>
