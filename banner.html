<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curved Banner</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: #fff;
    font-family: system-ui, sans-serif;
  }

  /* The shape: a rectangle with rounded right corners whose left edge is
     cut by a curve traced from the reference image. The mask has two
     layers: the traced curve piece on the left, and a plain fill for the
     rest. Both scale with --h, so the curve keeps its proportions while
     the straight part stretches to any width. */
  .banner {
    --h: 250px;
    --cw: calc(var(--h) * .96);    /* width of the curved piece (240 / 250) */
    --curve: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 250' preserveAspectRatio='none'%3E%3Cpath d='M240 0L2.71 0L2.71 0.5L9.6 1.5L15.72 2.5L21.66 3.5L27.4 4.5L32.46 5.5L37.45 6.5L42.29 7.5L47.05 8.5L51.19 9.5L55.24 10.5L59.22 11.5L63.13 12.5L66.97 13.5L70.23 14.5L73.96 15.5L77.11 16.5L80.74 17.5L83.8 18.5L86.83 19.5L89.81 20.5L92.74 21.5L95.09 22.5L97.98 23.5L100.79 24.5L103.61 25.5L105.85 26.5L108.6 27.5L110.8 28.5L112.96 29.5L115.63 30.5L117.76 31.5L119.85 32.5L121.91 33.5L124.5 34.5L126.53 35.5L128.54 36.5L130.54 37.5L132.5 38.5L134.46 39.5L135.87 40.5L137.79 41.5L139.69 42.5L141.58 43.5L143.45 44.5L144.79 45.5L146.64 46.5L148.46 47.5L149.76 48.5L151.56 49.5L153.35 50.5L154.6 51.5L156.38 52.5L157.59 53.5L159.34 54.5L160.54 55.5L161.74 56.5L163.44 57.5L164.61 58.5L166.31 59.5L167.44 60.5L168.57 61.5L169.72 62.5L171.36 63.5L172.47 64.5L173.58 65.5L174.66 66.5L176.26 67.5L177.32 68.5L178.38 69.5L179.44 70.5L180.5 71.5L181.56 72.5L182.61 73.5L183.63 74.5L184.65 75.5L185.67 76.5L186.67 77.5L187.66 78.5L188.66 79.5L189.64 80.5L190.62 81.5L191.58 82.5L192.54 83.5L193.5 84.5L194.46 85.5L195.4 86.5L196.35 87.5L197.26 88.5L197.63 89.5L198.55 90.5L199.46 91.5L200.38 92.5L201.3 93.5L202.2 94.5L202.56 95.5L203.44 96.5L204.34 97.5L205.21 98.5L205.53 99.5L206.41 100.5L207.27 101.5L207.59 102.5L208.44 103.5L209.29 104.5L209.59 105.5L210.43 106.5L211.27 107.5L211.55 108.5L212.38 109.5L213.19 110.5L213.46 111.5L214.27 112.5L214.53 113.5L215.35 114.5L216.13 115.5L216.41 116.5L217.2 117.5L217.43 118.5L218.22 119.5L218.44 120.5L219.22 121.5L219.45 122.5L220.24 123.5L220.45 124.5L221.22 125.5L221.42 126.5L222.17 127.5L222.38 128.5L223.11 129.5L223.34 130.5L223.53 131.5L224.29 132.5L224.46 133.5L225.19 134.5L225.38 135.5L226.08 136.5L226.28 137.5L226.45 138.5L227.15 139.5L227.33 140.5L227.48 141.5L228.19 142.5L228.36 143.5L228.49 144.5L229.19 145.5L229.34 146.5L229.47 147.5L230.15 148.5L230.29 149.5L230.42 150.5L231.07 151.5L231.22 152.5L2     position: relative;
    width: min(853px, 100%);
    height: var(--h);
    border-radius: 0 20px 20px 0;
    background: #000;
    color: #fff;
    -webkit-mask:
      var(--curve) 0 0 / var(--cw) 100% no-repeat,
      linear-gradient(#000 0 0) calc(var(--cw) - 1px) 0 / calc(100% - var(--cw) + 1px) 100% no-repeat;
    mask:
      var(--curve) 0 0 / var(--cw) 100% no-repeat,
      linear-gradient(#000 0 0) calc(var(--cw) - 1px) 0 / calc(100% - var(--cw) + 1px) 100% no-repeat;
    display: flex;
    align-items: center;
    padding: 0 40px 0 calc(var(--cw) + 20px);   /* keep content clear of the curve */
  }
  .banner .content { display: grid; gap: 10px; }
  .banner h1 { margin: 0; font-size: 30px; line-height: 1.1; letter-spacing: -.01em; }
  .banner p { margin: 0; font-size: 15px; opacity: .8; }
  .banner a {
    justify-self: start;
    margin-top: 6px;
    padding: 10px 20px;
    border-radius: 999px;
    background: #fff;
    color: #000;
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
    transition: transform .2s ease;
  }
  .banner a:hover { transform: translateY(-2px); }
  .banner a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  @media (max-width: 600px) {
    .banner { --h: 200px; padding-right: 20px; }
    .banner h1 { font-size: 22px; }
    .banner p { font-size: 13px; }
  }
</style>
</head>
<body>
  <section class="banner" aria-label="Promotion">
    <div class="content">
      <h1>Your headline here</h1>
      <p>A short line of supporting text.</p>
      <a href="#">Shop now</a>
    </div>
  </section>
</body>
</html>
