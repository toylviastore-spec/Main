<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Circle</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 25% 30%, #ff7eb3 0 14%, transparent 15%),
      radial-gradient(circle at 78% 28%, #7afcff 0 16%, transparent 17%),
      radial-gradient(circle at 70% 78%, #feff9c 0 13%, transparent 14%),
      radial-gradient(circle at 28% 80%, #a18cd1 0 16%, transparent 17%),
      linear-gradient(135deg, #1b2a6b, #2d1b4e 55%, #0f4c5c);
    font-family: system-ui, sans-serif;
  }
  .glass-circle {
    position: relative;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.4);
    color: #fff;
    font: 700 36px/1 system-ui, sans-serif;
    cursor: pointer;
    overflow: hidden;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.55), transparent 45%),
      linear-gradient(145deg, rgba(255,255,255,.25), rgba(255,255,255,.05));
    backdrop-filter: blur(16px) saturate(170%);
    -webkit-backdrop-filter: blur(16px) saturate(170%);
    box-shadow:
      0 18px 40px rgba(0,0,0,.35),
      inset 0 2px 1px rgba(255,255,255,.6),
      inset 0 -14px 24px rgba(255,255,255,.08);
    text-shadow: 0 2px 4px rgba(0,0,0,.35);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .glass-circle:hover { transform: scale(1.06); box-shadow: 0 24px 50px rgba(0,0,0,.4), inset 0 2px 1px rgba(255,255,255,.7); }
  .glass-circle:active { transform: scale(.95); }
  .glass-circle:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .glass-circle .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.55);
    transform: scale(0);
    animation: ripple .6s ease-out forwards;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }
</style>
</head>
<body>
  <button class="glass-circle" id="btn" aria-label="Click counter"><span id="count">0</span></button>
  <script>
    const btn = document.getElementById("btn");
    const count = document.getElementById("count");
    let n = 0;
    btn.addEventListener("click", (e) => {
      count.textContent = ++n;
      const r = btn.getBoundingClientRect();
      const size = 40;
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
      btn.appendChild(ripple);
      ripple.addEventListener("animationend", () => ripple.remove());
    });
  </script>
</body>
</html>
