<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Buttons</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, sans-serif;
    background:
      radial-gradient(circle at 20% 25%, #ff7eb3 0 12%, transparent 13%),
      radial-gradient(circle at 80% 30%, #7afcff 0 14%, transparent 15%),
      radial-gradient(circle at 65% 80%, #feff9c 0 12%, transparent 13%),
      radial-gradient(circle at 30% 85%, #a18cd1 0 15%, transparent 16%),
      linear-gradient(135deg, #1b2a6b, #2d1b4e 55%, #0f4c5c);
  }
  .stack {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    padding: 24px;
  }
  .glass-btn {
    position: relative;
    padding: 16px 34px;
    font: 600 17px/1 system-ui, sans-serif;
    color: #fff;
    letter-spacing: .02em;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 18px;
    background: linear-gradient(145deg, rgba(255,255,255,.28), rgba(255,255,255,.06));
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    box-shadow:
      0 8px 24px rgba(0,0,0,.3),
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 -8px 16px rgba(255,255,255,.06);
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    overflow: hidden;
  }
  .glass-btn::after {            /* moving shine */
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%);
    transform: translateX(-120%);
    transition: transform .6s ease;
  }
  .glass-btn:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.7); }
  .glass-btn:hover::after { transform: translateX(120%); }
  .glass-btn:active { transform: translateY(1px) scale(.97); }
  .glass-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  .pill   { border-radius: 999px; }
  .square { border-radius: 8px; }
  .tint-b { background: linear-gradient(145deg, rgba(90,160,255,.45), rgba(90,160,255,.1)); }
  .tint-g { background: linear-gradient(145deg, rgba(80,230,150,.45), rgba(80,230,150,.1)); }
  .round  { width: 64px; height: 64px; padding: 0; border-radius: 50%; font-size: 24px; }
</style>
</head>
<body>
  <div class="stack">
    <button class="glass-btn">Default</button>
    <button class="glass-btn pill tint-b">Pill Blue</button>
    <button class="glass-btn square">Square</button>
    <button class="glass-btn pill tint-g">Pill Green</button>
    <button class="glass-btn round" aria-label="Favorite">&#9829;</button>
  </div>
</body>
</html>
